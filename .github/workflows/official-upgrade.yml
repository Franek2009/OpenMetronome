name: Verify official 1.2.0 to 1.2.1 upgrade

on:
  workflow_dispatch:
    inputs:
      candidate_sha256:
        description: SHA-256 of the verified signed 1.2.1 APK in the draft
        required: true
        type: string

permissions:
  contents: read

jobs:
  upgrade:
    if: github.ref == 'refs/heads/main'
    name: official upgrade (API ${{ matrix.api }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
            arch: x86
          - api: 35
            arch: x86_64
    env:
      OFFICIAL_BASELINE_SHA256: 0679575ed389feeb1edf6ee32f446fbd955ef3b86a187372d0eb1950c3e574fc
      OFFICIAL_CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Check source and requested hash
        run: |
          set -euo pipefail
          [[ "$OFFICIAL_CANDIDATE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$(git rev-parse 'v1.2.1^{commit}')" = "$(git rev-parse HEAD)"
          source scripts/release-info.sh
          test "$release_version" = 1.2.1 && test "$release_code" = 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;36.0.0'
      - name: Download original release and signed draft APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p baseline candidate
          gh release download v1.2.0 --repo "$GITHUB_REPOSITORY" --pattern OpenMetronome-1.2.0.apk --dir baseline
          gh release download v1.2.1 --repo "$GITHUB_REPOSITORY" --pattern OpenMetronome-1.2.1.apk --dir candidate
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: ${{ matrix.arch }}
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ANDROID_SERIAL=emulator-5554 bash scripts/verify-upgrade.sh --official-1.2 baseline/OpenMetronome-1.2.0.apk candidate/OpenMetronome-1.2.1.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-upgrade-api${{ matrix.api }}
          path: app/build/reports/upgrade-validation/
          if-no-files-found: warn
          retention-days: 14
