name: Android verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # setup-gradle validates the wrapper JAR as well as caching Gradle dependencies.
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Android SDK explicitly
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0 platform-tools'

      - name: Script tests
        run: |
          bash scripts/test-verification-parser.sh
          bash scripts/test-release-tools.sh

      - name: Unit tests, Lint and builds (release is unsigned)
        run: >-
          ./gradlew --no-daemon --stacktrace
          :app:testDebugUnitTest :app:lintDebug :app:lintRelease
          :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease

      - name: Upload test and Lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: openmetronome-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  quiet:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: openmetronome-debug
          path: quiet-apks
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Enable emulator acceleration on the disposable runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ANDROID_SERIAL=emulator-5554 bash scripts/quiet-emulator.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quiet-emulator-report
          path: app/build/reports/quiet-emulator/
          retention-days: 14
