name: Android verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # setup-gradle validates the wrapper JAR as well as caching Gradle dependencies.
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Android SDK explicitly
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0 platform-tools'

      - name: Script tests
        run: |
          bash scripts/test-verification-parser.sh
          bash scripts/test-release-tools.sh
          python3 scripts/test-upgrade-tools.py
          python3 scripts/test-dev-icon-input.py
          python3 scripts/test-dev-trace-tools.py
          python3 scripts/generate-sampled-bank.py --check

      - name: Unit tests, Lint and builds (release is unsigned)
        run: >-
          ./gradlew --no-daemon --stacktrace
          :app:testProdDebugUnitTest :app:lintProdDebug :app:lintProdRelease
          :app:assembleProdDebug :app:assembleProdDebugAndroidTest :app:assembleProdRelease
          :app:testDevDebugUnitTest :app:lintDevDebug :app:lintDevRelease
          :app:assembleDevDebug :app:assembleDevDebugAndroidTest :app:assembleDevRelease

      - name: Validate variant identities and release isolation
        run: python3 scripts/verify-build-variants.py

      - name: Analyze exported PCM without playback
        run: python3 scripts/analyze-click-bank.py

      - name: Upload test and Lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: openmetronome-debug
          path: |
            app/build/outputs/apk/prod/debug/*.apk
            app/build/outputs/apk/androidTest/prod/debug/*.apk
            app/build/outputs/apk/dev/debug/*.apk
            app/build/outputs/apk/androidTest/dev/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned upgrade candidate
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-candidate-unsigned
          path: app/build/outputs/apk/prod/release/app-prod-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14

  quiet:
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    name: quiet prod + dev (API ${{ matrix.api }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
            arch: x86
          - api: 35
            arch: x86_64
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: openmetronome-debug
          path: quiet-apks
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;36.0.0'
      - name: Download immutable stable coexistence baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v1.0.0 --repo Franek2009/OpenMetronome --pattern 'OpenMetronome-1.0.0.apk' --dir isolation-baseline
      - name: Enable emulator acceleration on the disposable runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: ${{ matrix.arch }}
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            ANDROID_SERIAL=emulator-5554 bash scripts/quiet-emulator.sh prod
            ANDROID_SERIAL=emulator-5554 bash scripts/quiet-emulator.sh dev
            ANDROID_SERIAL=emulator-5554 bash scripts/verify-variant-isolation.sh isolation-baseline/OpenMetronome-1.0.0.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quiet-emulator-report-api${{ matrix.api }}
          path: |
            app/build/reports/quiet-emulator/
            app/build/reports/variant-isolation/
          retention-days: 14


  upgrade:
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    name: upgrade (API ${{ matrix.api }})
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
            arch: x86
          - api: 35
            arch: x86_64
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: upgrade-candidate-unsigned
          path: upgrade-candidate
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;36.0.0'
      - name: Download fixed public upgrade baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v0.13.0-beta.3 --repo Franek2009/OpenMetronome --pattern 'OpenMetronome-0.13.0-beta.3.apk' --dir upgrade-baseline
      - name: Enable emulator acceleration on disposable runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: ${{ matrix.arch }}
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ANDROID_SERIAL=emulator-5554 bash scripts/verify-upgrade.sh upgrade-baseline/OpenMetronome-0.13.0-beta.3.apk upgrade-candidate/app-prod-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upgrade-report-api${{ matrix.api }}
          path: app/build/reports/upgrade-validation/
          retention-days: 14
