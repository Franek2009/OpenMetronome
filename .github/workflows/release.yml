name: Prepare signed prerelease

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag on main (e.g. v1.1.0-beta.1)
        required: true
        type: string

      include_dev:
        description: Include separately signed DEV APK (not required for PROD)
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: official-release
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Validate immutable source selection
        id: source
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          source scripts/release-info.sh
          test "$REQUESTED_TAG" = "$release_tag"
          git check-ref-format "refs/tags/$REQUESTED_TAG"
          commit=$(git rev-parse "refs/tags/$REQUESTED_TAG^{commit}")
          test "$commit" = "$(git rev-parse HEAD)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0 platform-tools'
      - name: Verify without signing secrets
        run: |
          bash scripts/test-verification-parser.sh
          bash scripts/test-release-tools.sh
          python3 scripts/test-release-draft.py
          python3 scripts/test-official-upgrade-guards.py
          ./gradlew --no-daemon --console=plain :app:testProdDebugUnitTest :app:lintProdDebug :app:lintProdRelease :app:assembleProdDebug :app:assembleProdDebugAndroidTest :app:assembleProdRelease :app:testDevDebugUnitTest :app:lintDevDebug :app:lintDevRelease :app:assembleDevDebug :app:assembleDevDebugAndroidTest :app:assembleDevRelease
          python3 scripts/verify-build-variants.py
          python3 scripts/analyze-click-bank.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-verification
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: quiet-test-apks
          path: |
            app/build/outputs/apk/prod/debug/app-prod-debug.apk
            app/build/outputs/apk/androidTest/prod/debug/app-prod-debug-androidTest.apk
            app/build/outputs/apk/dev/debug/app-dev-debug.apk
            app/build/outputs/apk/androidTest/dev/debug/app-dev-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 14

  quiet:
    name: quiet signed-source (API ${{ matrix.api }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
            arch: x86
          - api: 35
            arch: x86_64
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: quiet-test-apks
          path: quiet-apks
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Enable emulator acceleration on the disposable runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: ${{ matrix.arch }}
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            ANDROID_SERIAL=emulator-5554 bash scripts/quiet-emulator.sh prod
            ANDROID_SERIAL=emulator-5554 bash scripts/quiet-emulator.sh dev
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quiet-emulator-report-api${{ matrix.api }}
          path: app/build/reports/quiet-emulator/
          retention-days: 14

  sign:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0 platform-tools'
      - name: Build and verify signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.OM_KEYSTORE_BASE64 }}
          OM_KEYSTORE_PASSWORD: ${{ secrets.OM_KEYSTORE_PASSWORD }}
          OM_KEY_PASSWORD: ${{ secrets.OM_KEY_PASSWORD }}
          OM_KEY_ALIAS: ${{ secrets.OM_KEY_ALIAS }}
          OM_CERT_SHA256: ${{ vars.OM_CERT_SHA256 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$KEYSTORE_BASE64"
          export OM_KEYSTORE_PATH="$RUNNER_TEMP/openmetronome.p12"
          trap 'rm -f -- "$OM_KEYSTORE_PATH"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$OM_KEYSTORE_PATH"
          unset KEYSTORE_BASE64
          ./gradlew --no-daemon --console=plain -PrequireReleaseSigning=true :app:assembleProdRelease
          bash scripts/package-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: official-signed-apk
          path: app/build/official-release/
          if-no-files-found: error
          retention-days: 14

  sign-dev:
    if: ${{ inputs.include_dev }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0 platform-tools'
      - name: Build and verify signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.OM_DEV_KEYSTORE_BASE64 }}
          OM_DEV_KEYSTORE_PASSWORD: ${{ secrets.OM_DEV_KEYSTORE_PASSWORD }}
          OM_DEV_KEY_PASSWORD: ${{ secrets.OM_DEV_KEY_PASSWORD }}
          OM_DEV_KEY_ALIAS: ${{ secrets.OM_DEV_KEY_ALIAS }}
          OM_DEV_CERT_SHA256: ${{ vars.OM_DEV_CERT_SHA256 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$KEYSTORE_BASE64"
          export OM_DEV_KEYSTORE_PATH="$RUNNER_TEMP/openmetronome-dev.p12"
          trap 'rm -f -- "$OM_DEV_KEYSTORE_PATH"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$OM_DEV_KEYSTORE_PATH"
          unset KEYSTORE_BASE64
          ./gradlew --no-daemon --console=plain -PrequireDevSigning=true :app:assembleDevRelease
          bash scripts/package-release.sh --dev
      - uses: actions/upload-artifact@v4
        with:
          name: official-signed-dev-apk
          path: app/build/official-dev-release/
          if-no-files-found: error
          retention-days: 14

  smoke:
    name: official selected variants (API ${{ matrix.api }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
            arch: x86
          - api: 35
            arch: x86_64
    needs: [verify, sign, sign-dev]
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.sign.result == 'success' && (needs.sign-dev.result == 'success' || (!inputs.include_dev && needs.sign-dev.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: official-signed-apk
          path: prod-assets
      - uses: actions/download-artifact@v4
        if: ${{ inputs.include_dev }}
        with:
          name: official-signed-dev-apk
          path: dev-assets
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Enable emulator acceleration on the disposable runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: ${{ matrix.arch }}
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            ANDROID_SERIAL=emulator-5554 bash scripts/smoke-release.sh "$(find prod-assets -name '*.apk')" app/build/reports/release-smoke/prod
            if [[ '${{ inputs.include_dev }}' == true ]]; then
              ANDROID_SERIAL=emulator-5554 bash scripts/smoke-release.sh --dev "$(find dev-assets -name '*.apk')" app/build/reports/release-smoke/dev
            fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-smoke-report-api${{ matrix.api }}
          path: app/build/reports/release-smoke/
          retention-days: 14

  draft:
    needs: [verify, quiet, sign, sign-dev, smoke]
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.sign.result == 'success' && needs.quiet.result == 'success' && needs.smoke.result == 'success' && (needs.sign-dev.result == 'success' || (!inputs.include_dev && needs.sign-dev.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: official-signed-apk
          path: prod-assets
      - uses: actions/download-artifact@v4
        if: ${{ inputs.include_dev }}
        with:
          name: official-signed-dev-apk
          path: dev-assets
      - name: Create draft only, never overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_INCLUDE_DEV: ${{ inputs.include_dev }}
        run: bash scripts/create-release-draft.sh prod-assets dev-assets
